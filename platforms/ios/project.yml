name: Lists
options:
  bundleIdPrefix: io.github.saxonbobart.lists
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.4"
    DEVELOPMENT_TEAM: LM99LGYW87
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    from: 5.1.2
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.1
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.18.0
targets:
  Lists:
    type: application
    platform: iOS
    sources:
      - path: Lists
    info:
      path: Lists/Info.plist
      properties:
        CFBundleDisplayName: Lists
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: io.github.saxonbobart.lists
            CFBundleURLSchemes:
              - lists
    entitlements:
      path: Lists/Lists.entitlements
      properties:
        com.apple.security.application-groups:
          - group.io.github.saxonbobart.lists
    dependencies:
      - package: Yams
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saxonbobart.lists
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_TESTABILITY: YES

  ListsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ListsTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: Lists
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.saxonbobart.lists.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Lists.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Lists"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Lists:
    build:
      targets:
        Lists: all
        ListsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Lists.xctestplan
          defaultPlan: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
