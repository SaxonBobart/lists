<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; frame-src 'none'"><link rel="stylesheet" href="katex/katex.min.css"><script src="katex/katex.min.js"></script><script src="mermaid/mermaid.min.js"></script><style>html,body{margin:0;padding:0;background:transparent;font-family:-apple-system}#result{display:inline-block;box-sizing:border-box;max-width:100%;padding:4px 8px}.katex-display{margin:4px 0}svg{max-width:100%;height:auto}</style></head><body><div id="result"></div><script>
window.renderDocumentSyntax=async function(source,kind,dark,size,width){
 const el=document.getElementById('result');el.replaceChildren();el.style.color=dark?'#ffffff':'#000000';el.style.fontSize=size+'px';el.style.maxWidth=width+'px';
 try {
 if(kind==='diagram'){
  mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:dark?'dark':'default',maxTextSize:30000,maxEdges:500,htmlLabels:false,secure:['secure','securityLevel','startOnLoad','maxTextSize','maxEdges','htmlLabels']});
  const result=await mermaid.render('diagram',source);el.innerHTML=result.svg;
 }else{katex.render(source,el,{displayMode:kind==='display',throwOnError:true,trust:false,maxExpand:1000,maxSize:20,output:'htmlAndMathml'});}
 void el.offsetWidth;await document.fonts.ready;const rect=el.getBoundingClientRect();return {width:Math.min(width,Math.ceil(Math.max(rect.width,el.scrollWidth))),height:Math.min(1400,Math.ceil(rect.height))};
 } catch(error) { el.replaceChildren(); return {error: String(error.message || error).replace(/^KaTeX parse error:\s*/, '').slice(0, 500)}; }
};
</script></body></html>
