<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lists — Design</title>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { margin:0; padding:0; height:100%; background:#f0eee9; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  @keyframes caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="src/primitives.jsx"></script>
<script type="text/babel" src="src/system.jsx"></script>
<script type="text/babel" src="src/screens-mobile.jsx"></script>
<script type="text/babel" src="src/screens-detail.jsx"></script>
<script type="text/babel" src="src/screens-novelty.jsx"></script>
<script type="text/babel" src="src/screens-extra.jsx"></script>
<script type="text/babel" src="src/screens-sidebar-alts.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

// Phone wrapper — applies theme + density
const Phone = ({ theme = 'light', density = 'comfortable', dark, children, w = 360, h = 760 }) => (
  <ThemeRoot theme={theme} density={density}>
    <PhoneFrame dark={theme !== 'light'} width={w} height={h}>{children}</PhoneFrame>
  </ThemeRoot>
);

const SystemArtboard = ({ children, theme = 'light' }) => (
  <ThemeRoot theme={theme}>
    <div style={{ background: 'var(--bg-grouped)', height: '100%', overflow: 'hidden' }}>{children}</div>
  </ThemeRoot>
);

const App = () => (
  <DesignCanvas>
    <DCSection id="brief" title="Lists" subtitle="Calm. Honest. Yours. — Sage palette · SF Pro Rounded + SF Mono · iOS 26 native">
      <DCArtboard id="manifesto" label="Aesthetic brief" width={520} height={420}>
        <ThemeRoot theme="light">
          <div style={{ padding: 30, height: '100%', background: 'var(--bg-grouped)', display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--accent)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <Icon name="check" s={20} color="#fff" strokeWidth={2.4} />
              </div>
              <div style={{ fontSize: 26, fontWeight: 700, color: 'var(--fg-primary)', letterSpacing: -0.3 }}>Lists</div>
              <span className="mono" style={{ fontSize: 11, color: 'var(--fg-tertiary)', marginLeft: 'auto' }}>v1.0 · iOS 26</span>
            </div>
            <div style={{ fontSize: 14, color: 'var(--fg-secondary)', lineHeight: 1.55 }}>
              A beautiful, local-first markdown app for tasks, habits and notes. Calm, native, intentionally restrained — Apple Reminders' visual restraint, Things 3's polish, iA Writer's quiet authority. Sage primary over warm-paper neutrals.
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginTop: 4 }}>
              {[
                { l: 'Single primitive', v: 'item · task / habit / note' },
                { l: 'Storage', v: 'markdown + YAML on disk' },
                { l: 'Date and reminder', v: 'fully decoupled' },
                { l: 'Triggers', v: 'urgent · location' },
              ].map(x => (
                <div key={x.l} style={{ padding: 10, background: 'var(--bg-elevated)', borderRadius: 10 }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--fg-tertiary)', textTransform: 'uppercase', letterSpacing: 0.6 }}>{x.l}</div>
                  <div style={{ fontSize: 13, color: 'var(--fg-primary)', marginTop: 2 }}>{x.v}</div>
                </div>
              ))}
            </div>
            <div style={{ marginTop: 'auto', display: 'flex', gap: 10, alignItems: 'center' }}>
              <span className="mono" style={{ fontSize: 10, color: 'var(--fg-tertiary)' }}>oklch(0.55 0.06 145)</span>
              <div style={{ width: 18, height: 18, borderRadius: 9, background: 'var(--accent)' }} />
              <div style={{ width: 18, height: 18, borderRadius: 9, background: 'var(--accent-tint-bg)' }} />
              <div style={{ width: 18, height: 18, borderRadius: 9, background: 'var(--bg-grouped)', boxShadow: 'inset 0 0 0 0.5px var(--sep-opaque)' }} />
              <div style={{ width: 18, height: 18, borderRadius: 9, background: 'var(--fg-primary)' }} />
            </div>
          </div>
        </ThemeRoot>
      </DCArtboard>
    </DCSection>

    {/* ── DESIGN SYSTEM ─────────────────────────────────────── */}
    <DCSection id="system" title="Design system" subtitle="Tokens, type, icons, spacing, motion">
      <DCArtboard id="color-light" label="Color · light" width={420} height={520}>
        <SystemArtboard><ColorPalette /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="color-dark" label="Color · dark" width={420} height={520}>
        <SystemArtboard theme="dark"><ColorPalette /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="color-oled" label="Color · OLED" width={420} height={520}>
        <SystemArtboard theme="oled"><ColorPalette /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="type" label="Typography · SF Pro Rounded + SF Mono" width={520} height={620}>
        <SystemArtboard><TypeScale /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="icons" label="Iconography" width={520} height={520}>
        <SystemArtboard><IconGrid /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="spacing" label="Spacing · radii · shadow" width={420} height={520}>
        <SystemArtboard><SpacingScale /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="motion" label="Motion" width={420} height={420}>
        <SystemArtboard><MotionScale /></SystemArtboard>
      </DCArtboard>
      <DCArtboard id="components" label="Components sampler" width={420} height={420}>
        <SystemArtboard><ComponentSampler /></SystemArtboard>
      </DCArtboard>
    </DCSection>

    {/* ── TIER 1 — light ──────────────────────────────────── */}
    <DCSection id="tier1-light" title="Tier 1 · iPhone · light" subtitle="Sidebar · Today · Apollo · Grocery · Item sheet · Inline edit">
      <DCArtboard id="t1-sidebar" label="01 Sidebar" width={400} height={840}>
        <Phone><SidebarScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-today" label="02 Today smart list" width={400} height={840}>
        <Phone><TodayScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-empty" label="03 Today · empty" width={400} height={840}>
        <Phone><TodayEmpty /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-list" label="04 List · vertical (Apollo)" width={400} height={840}>
        <Phone><ListVertical /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-grocery" label="05 List · grocery auto-categorized" width={400} height={840}>
        <Phone><GroceryScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-column" label="06 List · column / kanban" width={400} height={840}>
        <Phone><ListColumn /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-sheet" label="07 Item sheet" width={400} height={840}>
        <Phone><ItemSheet /></Phone>
      </DCArtboard>
      <DCArtboard id="t1-inline" label="08 Inline edit + accessory bar" width={400} height={840}>
        <Phone><InlineEditScreen /></Phone>
      </DCArtboard>
    </DCSection>

    {/* ── DARK + OLED ──────────────────────────────────────── */}
    <DCSection id="tier1-dark" title="Tier 1 · dark + OLED" subtitle="Same screens, dark surfaces and true-black">
      <DCArtboard id="d-sidebar" label="Sidebar · dark" width={400} height={840}>
        <Phone theme="dark"><SidebarScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="d-today" label="Today · dark" width={400} height={840}>
        <Phone theme="dark"><TodayScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="d-list" label="Apollo · dark" width={400} height={840}>
        <Phone theme="dark"><ListVertical /></Phone>
      </DCArtboard>
      <DCArtboard id="d-sheet" label="Item sheet · dark" width={400} height={840}>
        <Phone theme="dark"><ItemSheet /></Phone>
      </DCArtboard>
      <DCArtboard id="o-sidebar" label="Sidebar · OLED" width={400} height={840}>
        <Phone theme="oled"><SidebarScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="o-today" label="Today · OLED" width={400} height={840}>
        <Phone theme="oled"><TodayScreen /></Phone>
      </DCArtboard>
    </DCSection>

    {/* ── DENSITY ─────────────────────────────────────────── */}
    <DCSection id="density" title="Density variants" subtitle="Same data, three densities — Comfortable is default">
      <DCArtboard id="den-comp" label="Compact · 44pt rows" width={400} height={840}>
        <Phone density="compact"><DensityVariant density="compact" label="Compact · 44pt rows" /></Phone>
      </DCArtboard>
      <DCArtboard id="den-comf" label="Comfortable · 56pt rows (default)" width={400} height={840}>
        <Phone><DensityVariant density="comfortable" label="Comfortable · 56pt rows" /></Phone>
      </DCArtboard>
      <DCArtboard id="den-cozy" label="Cozy · 68pt rows" width={400} height={840}>
        <Phone density="cozy"><DensityVariant density="cozy" label="Cozy · 68pt rows" /></Phone>
      </DCArtboard>
    </DCSection>

    {/* ── HABIT HEATMAP VARIANTS ──────────────────────────── */}
    <DCSection id="habits" title="Habit detail · heatmap variations" subtitle="Three cell styles — same data">
      <DCArtboard id="h-square" label="A · GitHub-style squares" width={400} height={840}>
        <Phone><HabitDetail variant="square" /></Phone>
      </DCArtboard>
      <DCArtboard id="h-rounded" label="B · Rounded squares (Apple Health)" width={400} height={840}>
        <Phone><HabitDetail variant="rounded" /></Phone>
      </DCArtboard>
      <DCArtboard id="h-dot" label="C · Dot matrix" width={400} height={840}>
        <Phone><HabitDetail variant="dot" /></Phone>
      </DCArtboard>
      <DCArtboard id="h-dark" label="D · Rounded · dark" width={400} height={840}>
        <Phone theme="dark"><HabitDetail variant="rounded" /></Phone>
      </DCArtboard>
    </DCSection>

    {/* ── NOVELTY ─────────────────────────────────────────── */}
    <DCSection id="novelty" title="Novelty alternates · Today" subtitle="Three directions beyond by-the-book Reminders">
      <DCArtboard id="n-spine" label="A · Time-spine Today" width={400} height={840}>
        <Phone><TimeSpineToday /></Phone>
      </DCArtboard>
      <DCArtboard id="n-tot" label="B · Tot-style color-as-nav" width={400} height={840}>
        <Phone><TotStyleScreen /></Phone>
      </DCArtboard>
      <DCArtboard id="n-edit" label="C · Editorial · iA-Writer-flavored" width={400} height={840}>
        <Phone><EditorialToday /></Phone>
      </DCArtboard>
    </DCSection>

    {/* ── DESKTOP / iPAD ──────────────────────────────────── */}
    <DCSection id="desktop" title="macOS · three-pane" subtitle="Sidebar + list + detail · same tokens, same components">
      <DCArtboard id="mac-light" label="macOS · light" width={1100} height={680}>
        <ThemeRoot theme="light"><MacOSTriple /></ThemeRoot>
      </DCArtboard>
      <DCArtboard id="mac-dark" label="macOS · dark" width={1100} height={680}>
        <ThemeRoot theme="dark"><MacOSTriple /></ThemeRoot>
      </DCArtboard>
    </DCSection>

    <DCSection id="ipad" title="iPad · split" subtitle="Sidebar permanent, list as detail">
      <DCArtboard id="ipad-light" label="iPad · light · landscape" width={1100} height={780}>
        <ThemeRoot theme="light">
          <div style={{ display: 'flex', height: '100%', borderRadius: 18, overflow: 'hidden', boxShadow: '0 0 0 1px rgba(0,0,0,.08), 0 24px 60px rgba(0,0,0,.12)' }}>
            <div style={{ width: 320, background: 'var(--bg-surface-2)', borderRight: '0.5px solid var(--sep-translucent)' }}>
              <SidebarScreen />
            </div>
            <div style={{ flex: 1, position: 'relative' }}>
              <ListVertical />
            </div>
          </div>
        </ThemeRoot>
      </DCArtboard>
    </DCSection>

    {/* ── HOME ALTERNATES ─────────────────────────────────── */}
    <DCSection id="home-alts" title="Home screen · alternates · dark" subtitle="Eight ways to organize Smart Lists, My Lists, and Agents">
      <DCArtboard id="alt-a" label="A · Reminders-classic grid" width={400} height={840}>
        <Phone theme="dark"><SidebarA /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-b" label="B · Compact rows · dense" width={400} height={840}>
        <Phone theme="dark"><SidebarB /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-c" label="C · Today hero + chip row" width={400} height={840}>
        <Phone theme="dark"><SidebarC /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-d" label="D · Horizontal carousel" width={400} height={840}>
        <Phone theme="dark"><SidebarD /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-e" label="E · Customizable Pinned" width={400} height={840}>
        <Phone theme="dark"><SidebarE /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-f" label="F · Sectioned by purpose" width={400} height={840}>
        <Phone theme="dark"><SidebarF /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-g" label="G · Color-rail (Tot-style)" width={400} height={840}>
        <Phone theme="dark"><SidebarG /></Phone>
      </DCArtboard>
      <DCArtboard id="alt-h" label="H · Today widget · live preview" width={400} height={840}>
        <Phone theme="dark"><SidebarH /></Phone>
      </DCArtboard>
    </DCSection>

  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
